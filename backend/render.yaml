# Render Blueprint (docs/01 §5). 대시보드에서 "New → Blueprint" 로 이 파일을 지정하면 아래 설정으로 Web Service 가 만들어진다.
# 비밀값(sync: false)은 생성 후 Render 대시보드 환경변수 화면에서 직접 입력한다 — 저장소에 넣지 않는다.
services:
  - type: web
    name: asan-defence-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: free # 부스 당일에는 starter 이상으로 올리거나 외부 모니터 핑으로 슬립 방지(docs/06_booth_ops.md)
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render 프록시 뒤에서 실제 클라이언트 IP 를 보게 해 요청 제한(slowapi)이 IP 별로 동작하도록
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: BOOTH_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: FIRESTORE_COLLECTION_PREFIX
        value: defence_
      - key: VARIANTS_PER_QUESTION
        value: "2"
      - key: ALLOWED_ORIGINS
        sync: false # 예: https://<vercel-app>.vercel.app  (쉼표로 여러 개)
      - key: SESSION_SECRET
        generateValue: true # Render 가 무작위 값을 만들어 준다(32자 이상)
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false # 서비스 계정 JSON 내용을 그대로 붙여넣어도 됨(base64 도 가능)
      - key: FIREBASE_SERVICE_ACCOUNT_FILE
        sync: false
      - key: SENTRY_DSN
        sync: false
